<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RDSLP - Crea tu cuenta en la Red Social de Lenguajes de Programación.">
    <title>Crear Cuenta | RDSLP</title>
    <link rel="stylesheet" href="../Styles/common-legal.css">
    <link rel="stylesheet" href="../Styles/sesion.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="register-logo">RD</div>
                <h1>Crear Cuenta</h1>
                <p>Únete a la comunidad de programadores</p>
            </div>

            <!-- Botón de inicio rápido con Google -->
            <button type="button" class="btn-google" id="googleRegisterBtn">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Registrarse con Google</span>
            </button>

            <div class="divider">
                <span>o con correo electrónico</span>
            </div>

            <form class="register-form" id="registerForm">
                <div class="error-message" id="errorMessage" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="errorText">Error en el registro</span>
                </div>

                <div class="success-message" id="successMessage" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span id="successText">Cuenta creada exitosamente</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">Nombre</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="firstName" name="firstName" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Apellido</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="lastName" name="lastName" placeholder="Tu apellido" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required
                            autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required
                            minlength="6">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Ver u ocultar contraseña">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" id="eyeIcon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Fortaleza de la contraseña</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Repite tu contraseña" required>
                    </div>
                </div>
                <div class="form-group legal-consent-group">
                    <label class="terms-checkbox">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>He leído y acepto los <button type="button" class="legal-btn-link"
                                id="openTermsRegister">Términos y Condiciones</button> y la <button type="button"
                                class="legal-btn-link" id="openHabeasRegister">Política de Privacidad</button>.</span>
                    </label>
                </div>

                <button type="submit" class="btn-register" id="btnRegister">
                    Crear Cuenta
                </button>

                <div class="divider">
                    <span>o</span>
                </div>

                <p class="login-link">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Scripts del Sistema -->
    <script src="../JS/legal.js"></script>
    <script src="../JS/supabase-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const registerForm         = document.getElementById('registerForm');
            const passwordInput        = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const togglePassword       = document.getElementById('togglePassword');
            const eyeIcon              = document.getElementById('eyeIcon');
            const errorMessage         = document.getElementById('errorMessage');
            const errorText            = document.getElementById('errorText');
            const successMessage       = document.getElementById('successMessage');
            const successText          = document.getElementById('successText');
            const strengthFill         = document.getElementById('strengthFill');
            const strengthText         = document.getElementById('strengthText');
            const btnRegister          = document.getElementById('btnRegister');
            const googleRegisterBtn    = document.getElementById('googleRegisterBtn');

            // ── Toggle mostrar / ocultar contraseña ───────────────────────────
            togglePassword.addEventListener('click', function () {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                const newType = isPassword ? 'text' : 'password';
                passwordInput.setAttribute('type', newType);
                confirmPasswordInput.setAttribute('type', newType);

                eyeIcon.innerHTML = isPassword
                    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="23" x2="23" y2="23"></line>`
                    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            });

            // ── Medidor dinámico de fortaleza de contraseña ──────────────────
            passwordInput.addEventListener('input', function () {
                const val = passwordInput.value;
                const strength = calculateStrength(val);

                strengthFill.className = 'strength-fill';
                strengthText.className = 'strength-text';

                if (val.length === 0) {
                    strengthText.textContent = 'Fortaleza de la contraseña';
                } else if (strength === 'weak') {
                    strengthFill.classList.add('weak');
                    strengthText.classList.add('weak');
                    strengthText.textContent = 'Contraseña débil';
                } else if (strength === 'medium') {
                    strengthFill.classList.add('medium');
                    strengthText.classList.add('medium');
                    strengthText.textContent = 'Contraseña media';
                } else {
                    strengthFill.classList.add('strong');
                    strengthText.classList.add('strong');
                    strengthText.textContent = 'Contraseña fuerte';
                }
            });

            function calculateStrength(pwd) {
                let score = 0;
                if (pwd.length >= 6) score++;
                if (pwd.length >= 8) score++;
                if (/[A-Z]/.test(pwd)) score++;
                if (/[a-z]/.test(pwd)) score++;
                if (/[0-9]/.test(pwd)) score++;
                if (/[^A-Za-z0-9]/.test(pwd)) score++;

                if (score <= 2) return 'weak';
                if (score <= 4) return 'medium';
                return 'strong';
            }

            // ── Registro con Google OAuth ─────────────────────────────────────
            googleRegisterBtn.addEventListener('click', async function () {
                try {
                    googleRegisterBtn.disabled = true;
                    googleRegisterBtn.style.opacity = '0.7';
                    await window.rdslpSupabase.signInWithGoogle();
                } catch (err) {
                    showError(err.message || 'Error al conectar con Google OAuth');
                    googleRegisterBtn.disabled = false;
                    googleRegisterBtn.style.opacity = '1';
                }
            });

            // ── Envío del Formulario a Supabase ──────────────────────────────
            registerForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const terms = document.getElementById('terms').checked;

                hideMessages();

                if (!firstName || !lastName || !email || !password || !confirmPassword) {
                    showError('Por favor completa todos los campos requeridos.');
                    return;
                }

                if (password !== confirmPassword) {
                    showError('Las contraseñas no coinciden.');
                    return;
                }

                if (password.length < 6) {
                    showError('La contraseña debe tener al menos 6 caracteres.');
                    return;
                }

                if (!terms) {
                    showError('Debes aceptar los Términos y la Política de Privacidad.');
                    return;
                }

                setLoading(true);

                try {
                    const result = await window.rdslpSupabase.signUpWithEmail({
                        email,
                        password,
                        firstName,
                        lastName,
                        role: 'user'
                    });

                    if (result && result.autoLoggedIn) {
                        showSuccess('¡Cuenta creada exitosamente! Ingresando a tu panel...');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1200);
                    } else if (result && result.requiresEmailConfirmation) {
                        showSuccess('¡Registro completado! Hemos enviado un enlace de confirmación a tu correo. Revisa tu bandeja para poder iniciar sesión.');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3500);
                    } else {
                        showSuccess('¡Cuenta creada exitosamente! Redirigiendo...');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1200);
                    }

                } catch (err) {
                    console.error('Error al registrar usuario:', err);
                    let msg = err.message || 'Error al crear la cuenta en la base de datos.';
                    if (msg.includes('already registered') || msg.includes('User already registered')) {
                        msg = 'Este correo ya se encuentra registrado. Intenta iniciar sesión.';
                    }
                    showError(msg);
                    setLoading(false);
                }
            });

            function showError(msg) {
                errorText.textContent = msg;
                errorMessage.style.display = 'flex';
                successMessage.style.display = 'none';
                registerForm.style.animation = 'shake 0.4s ease';
                setTimeout(() => registerForm.style.animation = '', 400);
            }

            function showSuccess(msg) {
                successText.textContent = msg;
                successMessage.style.display = 'flex';
                errorMessage.style.display = 'none';
            }

            function hideMessages() {
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
            }

            function setLoading(loading) {
                btnRegister.disabled = loading;
                btnRegister.textContent = loading ? 'Creando cuenta...' : 'Crear Cuenta';
            }
        });
    </script>
</body>

</html>
