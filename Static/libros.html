    <script>
        (function(){
            try {
                var raw = sessionStorage.getItem('rdslp_user') || localStorage.getItem('rdslp_user');
                var u = raw ? JSON.parse(raw) : null;
                var r = (u && u.role) ? u.role.toLowerCase() : 'user';
                var root = document.documentElement;
                if (r === 'admin' || r === 'administrador') {
                    root.classList.add('role-admin');
                } else if (r === 'moderator' || r === 'moderador') {
                    root.classList.add('role-moderator');
                } else {
                    root.classList.add('role-user');
                }
            } catch(e) {}
        })();
    </script>
