    <!-- Main Content -->
    <main class="main-content">
        <header class="main-header">
            <div class="header-left">
                <h1 class="page-title">Comunidad</h1>
            </div>
            <div class="header-right">
                <div class="user-menu">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="user-name" id="userName">Usuario</span>
                </div>
            </div>
        </header>

        <div class="comunidad-container">
            <div class="section-header">
                <h2>Conecta con otros Programadores</h2>
                <p>Chatea y participa en eventos virtuales</p>
            </div>

            <div class="community-layout">
                <!-- Chat Section -->
                <div class="community-chat">
                    <div class="chat-header">
                        <h3>Chat General</h3>
                        <div class="chat-tabs">
                            <button class="chat-tab active" data-chat="general">General</button>
                            <button class="chat-tab" data-chat="ayuda">Ayuda</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <!-- Mensajes cargados dinámicamente -->
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                        <button class="send-btn" id="sendMessageBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Events Section -->
                <div class="community-events">
                    <div class="events-header">
                        <h3>Encuentros Virtuales</h3>
                        <button class="btn-create-event" id="createEventBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Crear Evento
                        </button>
                    </div>
                    <div class="events-list" id="eventsList">
                        <!-- Eventos cargados dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para crear evento -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Crear Nuevo Evento</h3>
                <button class="modal-close" id="closeEventModal">&times;</button>
            </div>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventTitle">Título del evento</label>
                    <input type="text" id="eventTitle" required placeholder="Ej: Introducción a React">
                </div>
                <div class="form-group">
                    <label for="eventDescription">Descripción</label>
                    <textarea id="eventDescription" required rows="3"
                        placeholder="Describe el tema del evento..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Fecha y hora</label>
                        <input type="datetime-local" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventMax">Participantes máx.</label>
                        <input type="number" id="eventMax" required min="2" max="100" value="20">
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventCategory">Categoría</label>
                    <select id="eventCategory" required>
                        <option value="logica">Lógica de Programación</option>
                        <option value="lenguajes">Lenguajes</option>
                        <option value="databases">Bases de Datos</option>
                        <option value="libros">Libros</option>
                        <option value="general">General</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save">Crear Evento</button>
                    <button type="button" class="btn-cancel" id="cancelEvent">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../JS/auth.js"></script>
    <script src="../JS/comunidad.js"></script>

</html>
